version: 2

models:
  - name: employee
    description: "Employee dbt model"
    columns:
      - name: EMP_ID
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                config:
                  severity: warn
      - name: EMP_SALARY
        data_tests:
          - salarycheck
  - name: customer
    description: "Customer dbt model"
  - name: customer_vw
    description: "Customer View dbt model"


sources:
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW
  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC
