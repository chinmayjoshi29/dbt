version: 2

models:
  - name: employee
    description: "Employee dbt model"
    columns:
      - name: EMP_ID
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                config:
                  severity: warn
      - name: EMP_SALARY
        data_tests:
          - salarycheck

  - name: customer
    description: "Customer dbt model"

  - name: customer_vw
    description: "Customer View dbt model"

  - name: sales
    description: "Sales dbt model"

  - name: product
    description: "Product dbt model"

  - name: purchase
    description: "Purchase dbt model"

  - name: clean_orders
    description: "clean_orders ephemeral model"

  - name: final_orders
    description: "final_orders dbt model"

sources:

  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW

  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC

  - name: sales
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SALES_SRC

  - name: product
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PRODUCT_SRC

  - name: purchase
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PURCHASE_SRC

  - name: orders
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: BASE_ORDERS

